<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<title>Reports & Analytics — AgriPrice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app">
<div id="page-loader"><span class="loader-leaf"><i class="fa-solid fa-seedling"></i></span><span class="spinner dark"></span></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>

    <main class="page-body">
      <div class="page-head">
        <div><h1>Reports & Analytics</h1><p>A snapshot of price behavior across Rizal Province markets.</p></div>
      </div>

      <div class="stat-grid">
        <div class="card analytics-card"><div class="a-ic"><i class="fa-solid fa-arrow-trend-up"></i></div><div class="a-val" id="statHighest">₱0</div><div class="a-lab">Highest Price</div></div>
        <div class="card analytics-card"><div class="a-ic"><i class="fa-solid fa-arrow-trend-down"></i></div><div class="a-val" id="statLowest">₱0</div><div class="a-lab">Lowest Price</div></div>
        <div class="card analytics-card"><div class="a-ic"><i class="fa-solid fa-chart-column"></i></div><div class="a-val" id="statAverage">₱0</div><div class="a-lab">Average Price</div></div>
        <div class="card analytics-card"><div class="a-ic"><i class="fa-solid fa-trophy"></i></div><div class="a-val" id="statMostSold">—</div><div class="a-lab">Most Sold Crop</div></div>
      </div>

      <div class="card card-pad">
        <div class="card-head"><h3>Monthly Price Trend (Average, ₱/kg)</h3></div>
        <div class="canvas-wrap"><canvas id="trendCanvas"></canvas></div>
      </div>

      <div style="height:22px;"></div>

      <div class="card card-pad">
        <div class="card-head"><h3>Average Price by Crop</h3></div>
        <div class="canvas-wrap"><canvas id="cropBarCanvas"></canvas></div>
      </div>
    </main>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script>
  AgriLayout.init('reports.html', 'Reports & Analytics');

  const A = AgriData.ANALYTICS;
  document.getElementById('statHighest').textContent = AgriUtils.pesoRound(A.highest.price);
  document.getElementById('statLowest').textContent = AgriUtils.pesoRound(A.lowest.price);
  document.getElementById('statAverage').textContent = AgriUtils.pesoRound(A.average);
  document.getElementById('statMostSold').textContent = A.mostSold;

  function drawCharts(){
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    AgriCharts.lineChart(document.getElementById('trendCanvas'), [
      { data: A.monthlyTrend, color: AgriCharts.palette.leaf }
    ], months, {});

    const cropAverages = AgriData.CROPS.map(c => {
      const matches = AgriData.CROP_PRICES.filter(p => p.crop === c.name);
      const avg = matches.reduce((s,p) => s + p.price, 0) / (matches.length || 1);
      return { label: c.name.slice(0,3), value: Math.round(avg) };
    });
    AgriCharts.barChart(document.getElementById('cropBarCanvas'), cropAverages, AgriCharts.palette.soil);
  }

  drawCharts();
  window.addEventListener('resize', AgriUtils.debounce(drawCharts, 300));
</script>
</body>
</html>
