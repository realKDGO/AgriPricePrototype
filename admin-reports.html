<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="images/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/dashboard.css" rel="stylesheet"/>
<link href="css/admin.css" rel="stylesheet"/>
<title>Reports &amp; Analytics</title>
</head>
<body class="admin-app">
<div class="admin-shell">
<aside class="admin-sidebar" id="adminSidebar"></aside>
<div class="admin-main">
<header class="admin-topbar" id="adminTopbar"></header>
<main class="admin-body">
<div class="admin-page-head"><div><p>Generate filtered administrative reports and review market data summaries.</p></div><div class="admin-report-actions"><button class="btn btn-outline" id="pdfBtn"><i class="fa-solid fa-download"></i> Download Report</button><button class="btn btn-outline" id="csvBtn"><i class="fa-solid fa-file-csv"></i> Export CSV</button></div></div>
<div class="admin-toolbar">
<div class="admin-filter admin-report-type"><select id="reportType"><option>Crop Price Report</option><option>Market Price Comparison</option><option>Historical Price Report</option><option>Price Trend Report</option><option>Municipality Price Report</option><option>Forecast Report</option></select></div>
<div class="admin-filter"><select id="reportCrop"></select></div>
<div class="admin-filter"><select id="reportMarket"></select></div>
<div class="admin-filter"><select id="reportPeriod"><option>August 2026</option><option>Last 30 Days</option><option>2026</option></select></div>
</div>
<div class="admin-kpis"><div class="admin-kpi"><span>Records</span><strong id="rCount">0</strong></div><div class="admin-kpi"><span>Average Price</span><strong id="rAvg">₱0</strong></div><div class="admin-kpi"><span>Highest</span><strong id="rHigh">₱0</strong></div><div class="admin-kpi"><span>Lowest</span><strong id="rLow">₱0</strong></div></div>
<div class="admin-grid-2">

<section class="admin-card"><div class="admin-card-head"><h3 id="reportChartTitle">Crop Price Report</h3><span> analytics</span></div>
<svg aria-label="Price trend chart" class="admin-chart" role="img" viewbox="0 0 620 205">
<line class="gridline" x1="38" x2="600" y1="35" y2="35"></line><line class="gridline" x1="38" x2="600" y1="80" y2="80"></line>
<line class="gridline" x1="38" x2="600" y1="125" y2="125"></line><line class="gridline" x1="38" x2="600" y1="170" y2="170"></line>
<path class="area" d="M38 150 L105 135 L172 141 L239 112 L306 120 L373 88 L440 96 L507 62 L574 70 L574 170 L38 170 Z"></path>
<path class="line-main" d="M38 150 L105 135 L172 141 L239 112 L306 120 L373 88 L440 96 L507 62 L574 70"></path>
<circle class="dot" cx="38" cy="150" r="4"></circle><circle class="dot" cx="105" cy="135" r="4"></circle><circle class="dot" cx="172" cy="141" r="4"></circle>
<circle class="dot" cx="239" cy="112" r="4"></circle><circle class="dot" cx="306" cy="120" r="4"></circle><circle class="dot" cx="373" cy="88" r="4"></circle>
<circle class="dot" cx="440" cy="96" r="4"></circle><circle class="dot" cx="507" cy="62" r="4"></circle><circle class="dot" cx="574" cy="70" r="4"></circle>
<text x="38" y="193">Apr</text><text x="172" y="193">May</text><text x="306" y="193">Jun</text><text x="440" y="193">Jul</text><text x="560" y="193">Aug</text>
</svg></section>
<section class="admin-card"><div class="admin-card-head"><h3>Report Preview</h3><span>Top records</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Crop</th><th>Market</th><th>Price/kg</th><th>Date</th></tr></thead><tbody id="reportRows"></tbody></table></div></section>
</div>
</main>
</div>
</div>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/admin-store.js"></script>
<script src="js/admin-layout.js"></script>
<script src="js/admin-pages.js"></script>
<script src="js/custom-select.js"></script>
<script src="js/capture-fields.js"></script>
<script>
AgriAdminLayout.init('admin-reports.html','Reports & Analytics');

AgriAdminUI.fillSelect(AgriAdminUI.byId('reportCrop'),AgriAdminStore.getCrops(),'id','name','All Crops');AgriAdminUI.fillSelect(AgriAdminUI.byId('reportMarket'),AgriAdminStore.getMarkets(),'id','name','All Markets');
function report(){let rows=AgriAdminStore.getPrices(),c=AgriAdminUI.byId('reportCrop').value,m=AgriAdminUI.byId('reportMarket').value;if(c)rows=rows.filter(x=>x.cropId===c);if(m)rows=rows.filter(x=>x.marketId===m);const vals=rows.map(x=>x.price);AgriAdminUI.byId('rCount').textContent=rows.length;AgriAdminUI.byId('rAvg').textContent=AgriAdminUI.peso(vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0);AgriAdminUI.byId('rHigh').textContent=AgriAdminUI.peso(vals.length?Math.max(...vals):0);AgriAdminUI.byId('rLow').textContent=AgriAdminUI.peso(vals.length?Math.min(...vals):0);AgriAdminUI.byId('reportChartTitle').textContent=AgriAdminUI.byId('reportType').value;AgriAdminUI.byId('reportRows').innerHTML=rows.slice(0,7).map(x=>`<tr><td>${x.crop}</td><td>${x.market}</td><td>${AgriAdminUI.peso(x.price)}</td><td>${x.date}</td></tr>`).join('');}
['reportType','reportCrop','reportMarket','reportPeriod'].forEach(id=>AgriAdminUI.byId(id).onchange=report);AgriAdminUI.byId('pdfBtn').onclick=()=>AgriAdminUI.toast('PDF export prepared .','success','Reports');AgriAdminUI.byId('csvBtn').onclick=()=>AgriAdminUI.toast('CSV export prepared .','success','Reports');report();

</script>
</body>
</html>
