<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css"><title>Admin Sign In</title></head>
<body class="admin-login-page">
<div class="admin-login-shell">
  <section class="admin-login-card">
    <div class="admin-login-brand"><img src="images/logo.png" alt="AgriPrice logo"><div><strong>AgriPrice</strong><span>Administration</span></div></div>
    <div class="admin-login-heading"><h1>Admin Sign In</h1><p>Sign in to manage AgriPrice data and administrative functions.</p></div>
    <form id="adminLoginForm">
      <div class="form-group"><label for="adminEmail">Email Address</label><input id="adminEmail" type="email" value="admin@agriprice.ph" readonly></div>
      <div class="form-group"><label for="adminPassword">Password</label><div class="admin-password-field"><input id="adminPassword" type="password" value="admin1234" readonly><button type="button" id="adminPasswordToggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <a class="admin-login-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to AgriPrice</a>
  </section>
</div>
<script src="js/admin-layout.js"></script><script src="js/capture-fields.js"></script>
<script>
document.getElementById('adminLoginForm').addEventListener('submit',function(e){e.preventDefault();AgriAdminLayout.setRole('ADMIN');location.href='admin-dashboard.html';});
const pi=document.getElementById('adminPassword'),pt=document.getElementById('adminPasswordToggle');
pt.addEventListener('click',function(){const h=pi.type==='password';pi.type=h?'text':'password';pt.innerHTML=h?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>';window.AgriCaptureFields?.syncAll?.();});
</script>
</body></html>
