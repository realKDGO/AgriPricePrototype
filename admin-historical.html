<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="images/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/dashboard.css" rel="stylesheet"/>
<link href="css/admin.css" rel="stylesheet"/>
<title>Historical Prices</title>
</head>
<body class="admin-app">
<div class="admin-shell">
<aside class="admin-sidebar" id="adminSidebar"></aside>
<div class="admin-main">
<header class="admin-topbar" id="adminTopbar"></header>
<main class="admin-body">
<div class="admin-page-head"><div><p>Analyze accumulated price records and long-term market patterns.</p></div></div>
<div class="admin-toolbar">
<div class="admin-filter"><select id="histCrop"></select></div>
<div class="admin-filter"><select id="histMarket"></select></div>
<div class="admin-filter"><select id="histMunicipality"><option value="">All Municipalities</option><option>Teresa</option><option>Antipolo City</option><option>Taytay</option><option>Rodriguez</option></select></div>
<div class="admin-filter"><select id="histPeriod"><option>Last 30 Days</option><option>Last 60 Days</option><option>2026</option></select></div>
</div>
<div class="admin-kpis">
<div class="admin-kpi"><span>Average Price</span><strong id="histAvg">₱0</strong></div>
<div class="admin-kpi"><span>Highest Price</span><strong id="histHigh">₱0</strong></div>
<div class="admin-kpi"><span>Lowest Price</span><strong id="histLow">₱0</strong></div>
<div class="admin-kpi"><span>Price Change</span><strong id="histChange">+0%</strong></div>
</div>
<div class="admin-grid-2">

<section class="admin-card"><div class="admin-card-head"><h3>Price Trend</h3><span>Historical pattern</span></div>
<svg aria-label="Price trend chart" class="admin-chart" role="img" viewbox="0 0 620 205">
<line class="gridline" x1="38" x2="600" y1="35" y2="35"></line><line class="gridline" x1="38" x2="600" y1="80" y2="80"></line>
<line class="gridline" x1="38" x2="600" y1="125" y2="125"></line><line class="gridline" x1="38" x2="600" y1="170" y2="170"></line>
<path class="area" d="M38 150 L105 135 L172 141 L239 112 L306 120 L373 88 L440 96 L507 62 L574 70 L574 170 L38 170 Z"></path>
<path class="line-main" d="M38 150 L105 135 L172 141 L239 112 L306 120 L373 88 L440 96 L507 62 L574 70"></path>
<circle class="dot" cx="38" cy="150" r="4"></circle><circle class="dot" cx="105" cy="135" r="4"></circle><circle class="dot" cx="172" cy="141" r="4"></circle>
<circle class="dot" cx="239" cy="112" r="4"></circle><circle class="dot" cx="306" cy="120" r="4"></circle><circle class="dot" cx="373" cy="88" r="4"></circle>
<circle class="dot" cx="440" cy="96" r="4"></circle><circle class="dot" cx="507" cy="62" r="4"></circle><circle class="dot" cx="574" cy="70" r="4"></circle>
<text x="38" y="193">Apr</text><text x="172" y="193">May</text><text x="306" y="193">Jun</text><text x="440" y="193">Jul</text><text x="560" y="193">Aug</text>
</svg></section>
<section class="admin-card"><div class="admin-card-head"><h3>Historical Price Table</h3><span>Recent records</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Crop</th><th>Market</th><th>Price/kg</th></tr></thead><tbody id="histRows"></tbody></table></div></section>
</div>
</main>
</div>
</div>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/admin-store.js"></script>
<script src="js/admin-layout.js"></script>
<script src="js/admin-pages.js"></script>
<script src="js/custom-select.js"></script>
<script src="js/capture-fields.js"></script>
<script>
AgriAdminLayout.init('admin-historical.html','Historical Prices');

AgriAdminUI.fillSelect(AgriAdminUI.byId('histCrop'),AgriAdminStore.getCrops(),'id','name','All Crops');
AgriAdminUI.fillSelect(AgriAdminUI.byId('histMarket'),AgriAdminStore.getMarkets(),'id','name','All Markets');
function updateHist(){
 const cid=AgriAdminUI.byId('histCrop').value, mid=AgriAdminUI.byId('histMarket').value;
 let rows=AgriData.HISTORICAL_PRICES.map((r,i)=>({...r,id:i})).filter(r=>(!cid||AgriData.findCropByName(r.crop)?.id===cid)&&(!mid||AgriData.MARKETS.find(m=>m.name===r.market)?.id===mid));
 rows=rows.slice(0,8); const vals=rows.map(r=>r.price); const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0, hi=vals.length?Math.max(...vals):0,lo=vals.length?Math.min(...vals):0;
 AgriAdminUI.byId('histAvg').textContent=AgriAdminUI.peso(avg);AgriAdminUI.byId('histHigh').textContent=AgriAdminUI.peso(hi);AgriAdminUI.byId('histLow').textContent=AgriAdminUI.peso(lo);AgriAdminUI.byId('histChange').textContent=vals.length>1?`${((vals[0]-vals.at(-1))/vals.at(-1)*100)>=0?'+':''}${((vals[0]-vals.at(-1))/vals.at(-1)*100).toFixed(1)}%`:'+0.0%';
 AgriAdminUI.byId('histRows').innerHTML=rows.map(r=>`<tr><td>${r.date}</td><td>${r.crop}</td><td>${r.market}</td><td class="price-mono">${AgriAdminUI.peso(r.price)}</td></tr>`).join('');
}
['histCrop','histMarket','histMunicipality','histPeriod'].forEach(id=>AgriAdminUI.byId(id).onchange=updateHist);updateHist();

</script>
</body>
</html>
