<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css"><title>MAO Sign In</title></head>
<body class="admin-login-page">
<div class="admin-login-shell">
<section class="admin-login-card">
 <div class="admin-login-brand"><img src="images/logo.png" alt="AgriPrice logo"><div><strong>AgriPrice</strong><span>Municipal Agriculture Office</span></div></div>
 <div class="admin-login-heading"><h1>MAO Sign In</h1><p>Sign in to manage and validate agricultural information for your municipality.</p></div>
 <form id="maoLoginForm">
 <div class="form-group"><label for="maoEmail">Email Address</label><input id="maoEmail" type="email" value="king.obrero@mao-rizal.ph" readonly></div>
 <div class="form-group"><label for="maoPassword">Password</label><div class="admin-password-field"><input id="maoPassword" type="password" value="mao12345" readonly><button type="button" id="maoPasswordToggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
 <button class="btn btn-primary btn-block" type="submit">Sign In</button>
 </form>
 <a class="admin-login-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to AgriPrice</a>
</section></div>
<script src="js/admin-layout.js"></script><script src="js/capture-fields.js"></script>
<script>
document.getElementById('maoLoginForm').addEventListener('submit',e=>{e.preventDefault();AgriAdminLayout.setRole('MAO');location.href='mao-dashboard.html';});
const mp=document.getElementById('maoPassword'),mt=document.getElementById('maoPasswordToggle');
mt.addEventListener('click',()=>{const h=mp.type==='password';mp.type=h?'text':'password';mt.innerHTML=h?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>';window.AgriCaptureFields?.syncAll?.();});
</script></body></html>
